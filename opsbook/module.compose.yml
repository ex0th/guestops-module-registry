services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: guestops-module-opsbook:latest
    environment:
      DATABASE_URL: postgresql+asyncpg://${OPSBOOK_DB_USER}:${OPSBOOK_DB_PASSWORD}@${DB_HOST}:5432/${OPSBOOK_DB_NAME}
      DATABASE_URL_ADMIN: postgresql+asyncpg://${OPSBOOK_DB_ADMIN_USER}:${OPSBOOK_DB_ADMIN_PASSWORD}@${DB_HOST}:5432/${OPSBOOK_DB_NAME}
      SITE_SLUG: ${SITE_SLUG}
      SITE_ID: ${SITE_ID}
      CORE_JWKS_URL: ${CORE_JWKS_URL}
      DOCUMENTS_PATH: /data/documents
    volumes:
      - opsbook_documents_${SITE_SLUG}:/data/documents
    expose:
      - "8000"
    networks:
      - ${GUESTOPS_NETWORK}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SITE_SLUG}-opsbook.rule=Host(`${SITE_SLUG}.${BASE_DOMAIN}`) && PathPrefix(`/modules/opsbook`)"
      - "traefik.http.routers.${SITE_SLUG}-opsbook.entrypoints=websecure"
      - "traefik.http.routers.${SITE_SLUG}-opsbook.tls=true"
      - "traefik.http.routers.${SITE_SLUG}-opsbook.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${SITE_SLUG}-opsbook.middlewares=${SITE_SLUG}-opsbook-strip"
      - "traefik.http.middlewares.${SITE_SLUG}-opsbook-strip.stripprefix.prefixes=/modules/opsbook"
      - "traefik.http.services.${SITE_SLUG}-opsbook.loadbalancer.server.port=8000"

volumes:
  opsbook_documents_${SITE_SLUG}:
    name: opsbook_documents_${SITE_SLUG}

networks:
  ${GUESTOPS_NETWORK}:
    external: true
