# RoomOps — Module Compose
# Wird vom Deployment-Agent pro aktivierter Site gestartet.
# Der Compose-Projektname (-p) ist SERVICE_NAME, container_name ebenfalls.

services:
  app:
    image: ghcr.io/ex0th/guestops-module-roomops:${MODULE_VERSION:-latest}
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    networks:
      - guestops-net
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_ADMIN: ${DATABASE_URL_ADMIN:-}
      SITE_ID: ${SITE_ID}
      SITE_SLUG: ${SITE_SLUG}
      GUESTOPS_CORE_URL: http://backend:8000
      GUESTOPS_AGENT_TOKEN: ${GUESTOPS_AGENT_TOKEN}
      MODULE_VERSION: ${MODULE_VERSION:-latest}
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SERVICE_NAME}.rule=PathPrefix(`/sites/${SITE_SLUG}/modules/roomops`)"
      - "traefik.http.routers.${SERVICE_NAME}.priority=10"
      - "traefik.http.middlewares.${SERVICE_NAME}-strip.stripprefix.prefixes=/sites/${SITE_SLUG}/modules/roomops"
      - "traefik.http.middlewares.${SERVICE_NAME}-slash.redirectregex.regex=^(https?://[^/]+/sites/${SITE_SLUG}/modules/roomops)$$"
      - "traefik.http.middlewares.${SERVICE_NAME}-slash.redirectregex.replacement=$${1}/"
      - "traefik.http.middlewares.${SERVICE_NAME}-slash.redirectregex.permanent=false"
      - "traefik.http.routers.${SERVICE_NAME}.middlewares=${SERVICE_NAME}-slash,${SERVICE_NAME}-strip"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  guestops-net:
    external: true
    name: ${GUESTOPS_NETWORK}
