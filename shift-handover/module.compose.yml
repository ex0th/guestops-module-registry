# Shift Handover – Module Compose
# Wird vom Deployment-Agent pro aktivierter Site gestartet.
# SERVICE_NAME = shift-handover-site-{site_slug}, gesetzt vom Agent.

services:
  ${SERVICE_NAME}:
    image: ghcr.io/ex0th/guestops-module-shift-handover:${MODULE_VERSION:-latest}
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    networks:
      - guestops-net
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_ADMIN: ${DATABASE_URL_ADMIN}
      SITE_ID: ${SITE_ID}
      SITE_SLUG: ${SITE_SLUG}
      GUESTOPS_CORE_URL: http://backend:8000
      GUESTOPS_AGENT_TOKEN: ${GUESTOPS_AGENT_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      MODULE_VERSION: ${MODULE_VERSION:-latest}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  guestops-net:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-guestops}-net
