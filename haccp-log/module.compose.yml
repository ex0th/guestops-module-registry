services:
  app:
    image: ghcr.io/ex0th/guestops-module-haccp-log:${MODULE_VERSION:-latest}
    container_name: ${SERVICE_NAME}
    restart: unless-stopped
    networks:
      - guestops-net
    volumes:
      - haccp_log_data:/data
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_ADMIN: ${DATABASE_URL_ADMIN}
      SITE_ID: ${SITE_ID}
      SITE_SLUG: ${SITE_SLUG}
      GUESTOPS_CORE_URL: http://backend:8000
      GUESTOPS_AGENT_TOKEN: ${GUESTOPS_AGENT_TOKEN}
      MODULE_VERSION: ${MODULE_VERSION:-latest}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  haccp_log_data:

networks:
  guestops-net:
    external: true
    name: ${GUESTOPS_NETWORK}
